name: Probe sources
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          probe() { echo "$(curl -s -o /tmp/b -w '%{http_code} %{size_download}' -A "$2" --max-time 25 "$1") | $1 | $(head -c 160 /tmp/b | tr '\n' ' ')"; }
          for u in \
            "https://api.pullpush.io/reddit/search/submission/?subreddit=SkincareAddiction&size=3" \
            "https://arctic-shift.photon-reddit.com/api/posts/search?subreddit=SkincareAddiction&after=2026-10-26&before=2026-11-02&limit=3" \
            "https://arctic-shift.photon-reddit.com/api/comments/search?subreddit=SkincareAddiction&after=2026-10-26&before=2026-11-02&limit=3" \
            "https://www.reddit.com/r/SkincareAddiction/new.json?limit=3" \
            "https://old.reddit.com/r/SkincareAddiction/new.json?limit=3" \
            "https://www.reddit.com/r/SkincareAddiction/new/.rss" \
            "https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts?q=skincare&limit=3" \
            "https://api.bsky.app/xrpc/app.bsky.feed.searchPosts?q=skincare&limit=3" \
            "https://news.google.com/rss/search?q=skincare+viral&hl=en-US&gl=US&ceid=US:en" \
            "https://suggestqueries.google.com/complete/search?client=firefox&q=cerave+for" \
            "https://www.amazon.com/gp/movers-and-shakers/beauty/11060451" \
            "https://lemmy.world/api/v3/search?q=skincare&type_=Posts&limit=3" \
            "https://www.youtube.com/results?search_query=skincare" \
            "https://hn.algolia.com/api/v1/search?query=skincare" ; do
            probe "$u" "$UA"; probe "$u" "beauty-trend-tracker/1.0 (research)"; done
